name: "Reusable Poetry build workflow"
description: "Reusable workflow to install dependencies using poetry. Can be used in other workflows via 'uses: ./.github/actions/poetrybuild' and passing the required inputs."
inputs:
  python:
    default: "3.10"
    description: "Value for 'python-version'"
    required: false
    type: string
  poetry_args:
    default: ""
    description: "Additional arguments for the poetry install step'"
    required: false
    type: string
runs:
  using: "composite"
  steps:
    - name: Install poetry
      run: pipx install poetry
      shell: bash
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python }}
        cache: "poetry"
    - name: Install dependencies
      run: poetry install --no-interaction ${{ inputs.poetry_args }}
      shell: bash
